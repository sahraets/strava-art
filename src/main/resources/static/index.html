<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruter → Kunst</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --display:     "Plus Jakarta Sans", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            --mono:        ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

            --bg:          #f4efe4;
            --bg-soft:     #ebe4d5;
            --surface:     #faf7f0;
            --ink:         #16150f;
            --ink-muted:   #6a6558;
            --ink-faint:   #97907f;
            --line:        rgba(22, 21, 15, 0.14);
            --line-strong: rgba(22, 21, 15, 0.28);
            --route:       #16150f;
            --route-start: #16150f;
            --btn-bg:      #16150f;
            --btn-ink:     #faf7f0;
            --shadow:      0 1px 2px rgba(22, 21, 15, 0.06),
                           0 8px 24px rgba(22, 21, 15, 0.06);
        }

        :root:not([data-theme="light"]) {
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:          #100f0c;
                --bg-soft:     #191712;
                --surface:     #1b1915;
                --ink:         #f0eade;
                --ink-muted:   #a09986;
                --ink-faint:   #6f6a5c;
                --line:        rgba(240, 234, 222, 0.14);
                --line-strong: rgba(240, 234, 222, 0.30);
                --route:       #f0eade;
                --route-start: #f0eade;
                --btn-bg:      #f0eade;
                --btn-ink:     #100f0c;
                --shadow:      0 1px 2px rgba(0, 0, 0, 0.4),
                               0 8px 24px rgba(0, 0, 0, 0.35);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg:          #100f0c;
            --bg-soft:     #191712;
            --surface:     #1b1915;
            --ink:         #f0eade;
            --ink-muted:   #a09986;
            --ink-faint:   #6f6a5c;
            --line:        rgba(240, 234, 222, 0.14);
            --line-strong: rgba(240, 234, 222, 0.30);
            --route:       #f0eade;
            --route-start: #f0eade;
            --btn-bg:      #f0eade;
            --btn-ink:     #100f0c;
            --shadow:      0 1px 2px rgba(0, 0, 0, 0.4),
                           0 8px 24px rgba(0, 0, 0, 0.35);
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        [hidden] {
    display: none !important;
}

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .wrap {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 32px 120px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 28px 0;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        .mark svg { display: block; }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .theme-toggle:hover { border-color: var(--line-strong); background: var(--bg-soft); }
        .theme-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
        .theme-toggle svg { display: block; }
        .icon-moon { display: none; }
        :root[data-theme="dark"] .icon-sun { display: none; }
        :root[data-theme="dark"] .icon-moon { display: block; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .icon-sun  { display: none; }
            :root:not([data-theme="light"]) .icon-moon { display: block; }
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            align-items: start;
            gap: 64px;
            padding: 80px 0 64px;
            border-bottom: 1px solid var(--line-strong);
        }

        .hero h1 {
            margin: 0;
            font-family: var(--display);
            font-weight: 300;
            font-size: clamp(3rem, 8.5vw, 6rem);
            line-height: 0.92;
            letter-spacing: -0.035em;
        }

        .hero h1 em {
            font-style: italic;
        }

        .hero p {
            margin: 28px 0 0;
            max-width: 42ch;
            font-size: 1rem;
            color: var(--ink-muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 32px;
            margin-top: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 0 5px;
            border: 0;
            border-bottom: 1px solid var(--ink);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: gap 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .btn:hover { gap: 14px; }
        .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }

        .btn-ghost {
            color: var(--ink-muted);
            border-bottom-color: var(--line-strong);
        }

        .btn-ghost:hover { color: var(--ink); border-bottom-color: var(--ink); }

        .stats {
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            margin-top: 14px;
        }

        .stat {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 0;
        }

        .stat + .stat { border-top: 1px solid var(--line); }

        .stat-label {
            font-family: var(--mono);
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .stat-value {
            font-family: var(--display);

            font-weight: 400;
            font-size: 1.45rem;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 72px 0 28px;
        }

        .section-head h2,
        .section-index {
            margin: 0;
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 400;
            color: var(--ink-muted);
        }

        .section-index {
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            column-gap: 36px;
            row-gap: 64px;
        }

        .card {
            background: none;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .card canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background: var(--surface);
            border: 1px solid var(--line);
            transition: border-color 0.2s ease;
        }

        .card:hover canvas { border-color: var(--line-strong); }

        .card-body {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--ink);
        }

        .card-figures {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            font-family: var(--mono);
            font-size: 0.66rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }

        .card-title {
            margin: 9px 0 0;
            font-family: var(--display);

            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: -0.01em;
            overflow-wrap: anywhere;
        }

        .card-meta {
            margin: 5px 0 0;
            font-size: 0.8rem;
            color: var(--ink-muted);
        }

        .note {
            padding: 72px 0;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--line);
            color: var(--ink-muted);
            max-width: 46ch;
        }

        .note strong {
            display: block;
            margin-bottom: 8px;
            font-family: var(--display);

            font-size: 1.5rem;
            font-weight: 400;
            color: var(--ink);
        }

        .skeleton {
            background: var(--bg-soft);
            border: 1px solid var(--line);
            border-radius: 0;
            aspect-ratio: 1 / 1;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        footer {
            margin-top: 96px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 0.66rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        @media (max-width: 860px) {
            .wrap { padding: 0 20px 80px; }

            .hero {
                grid-template-columns: minmax(0, 1fr);
                gap: 40px;
                padding: 48px 0 40px;
            }

            .section-head { padding: 48px 0 24px; }

            #gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                column-gap: 24px;
                row-gap: 48px;
            }
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="mark">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2 13c2.5 0 3-9 6-9s3.5 9 6 9" stroke="currentColor" stroke-width="1.4"
                      stroke-linecap="round"/>
            </svg>

        </div>

        <button class="theme-toggle" id="themeToggle" type="button"
                aria-label="Bytt mellom lyst og mørkt tema">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
        </button>
    </div>

    <header class="hero">
        <div class="hero-main">
            <h1>routeprints</h1>
            <p>hver tur du har løpt eller syklet blir tegnet opp som en egen strek. </p>
            <div class="actions">
                <a class="btn" href="/login" id="loginBtn">Logg inn med Strava <span aria-hidden="true">→</span></a>
                <button class="btn btn-ghost" id="refreshBtn" type="button">Oppdater</button>
            </div>
        </div>

        <section class="stats" id="stats" hidden>
            <div class="stat">
                <span class="stat-label">Aktiviteter</span>
                <span class="stat-value" id="statCount">–</span>
            </div>
            <div class="stat">
                <span class="stat-label">Distanse</span>
                <span class="stat-value" id="statDistance">–</span>
            </div>
            <div class="stat">
                <span class="stat-label">Høyde</span>
                <span class="stat-value" id="statElevation">–</span>
            </div>
        </section>
    </header>

    <div class="section-head">
        <h2>Galleri</h2>
        <span class="section-index" id="galleryIndex"></span>
    </div>

    <div id="gallery"></div>

    <footer>Tegnet lokalt i nettleseren fra Strava-rutene dine.</footer>
</div>

<script>
    const root = document.documentElement;
    const stored = localStorage.getItem('theme');
    if (stored === 'light' || stored === 'dark') {
        root.setAttribute('data-theme', stored);
    }

    function currentTheme() {
        return root.getAttribute('data-theme')
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        const next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        redrawAll();
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!root.hasAttribute('data-theme')) redrawAll();
    });

    const SIZE = 400;
    const PADDING = 36;

    function cssVar(name) {
        return getComputedStyle(root).getPropertyValue(name).trim();
    }

    function seededRandom(seed) {
        let value = seed;
        return function () {
            value = (value * 9301 + 49297) % 233280;
            return value / 233280;
        };
    }

    function temperatureToHue(tempC) {
    const minTemp = -5, maxTemp = 30;
    const clamped = Math.max(minTemp, Math.min(maxTemp, tempC));
    const t = (clamped - minTemp) / (maxTemp - minTemp); // 0 = kaldt, 1 = varmt
    return 250 - t * 240; // 250 = blå/lilla (kaldt) ... 10 = rød/oransje (varmt)
}

function weatherStyle(weatherCode) {
    if (weatherCode === 0 || weatherCode === 1) {
        return { blobCount: [3, 5], blobAlpha: 0.28, saturation: 82, lightness: 30, lineAlpha: 0.65, lineWidth: 1.4, layers: [4, 9], mode: 'kaleidoscope' };
    }
    if (weatherCode === 2 || weatherCode === 3) {
        return { blobCount: [5, 8], blobAlpha: 0.35, saturation: 70, lightness: 34, lineAlpha: 0.55, lineWidth: 1.6, layers: [3, 8], mode: 'flow' };
    }
    if (weatherCode === 45 || weatherCode === 48) {
        return { blobCount: [7, 10], blobAlpha: 0.45, saturation: 40, lightness: 55, lineAlpha: 0.4, lineWidth: 1.8, layers: [3, 6], mode: 'particles' };
    }
    if ((weatherCode >= 51 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) {
        return { blobCount: [6, 9], blobAlpha: 0.4, saturation: 55, lightness: 40, lineAlpha: 0.45, lineWidth: 1.3, layers: [3, 7], mode: 'flow' };
    }
    if (weatherCode >= 71 && weatherCode <= 77) {
        return { blobCount: [4, 6], blobAlpha: 0.25, saturation: 30, lightness: 65, lineAlpha: 0.6, lineWidth: 1.5, layers: [3, 6], mode: 'particles' };
    }
    if (weatherCode >= 95) {
        return { blobCount: [8, 12], blobAlpha: 0.5, saturation: 85, lightness: 25, lineAlpha: 0.7, lineWidth: 1.8, layers: [5, 10], mode: 'kaleidoscope' };
    }
    return null;
}


    function drawWatercolorBackground(ctx, size, random, hue, style) {
    const [minBlobs, maxBlobs] = style.blobCount;
    const blobCount = minBlobs + Math.floor(random() * (maxBlobs - minBlobs + 1));

    for (let i = 0; i < blobCount; i++) {
        const blobHue = (hue + (random() - 0.5) * 140 + 360) % 360;
        const x = random() * size;
        const y = random() * size;
        const radius = size * (0.35 + random() * 0.45);

        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, `hsla(${blobHue}, ${style.saturation}%, ${style.lightness}%, ${style.blobAlpha})`);
        gradient.addColorStop(1, `hsla(${blobHue}, ${style.saturation}%, ${style.lightness}%, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawKaleidoscope(ctx, shapePoints, hue, style, random) {
    const [minLayers, maxLayers] = style.layers;
    const layers = minLayers + Math.floor(random() * (maxLayers - minLayers + 1));

    for (let i = 0; i < layers; i++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 * i) / layers);
        ctx.strokeStyle = `hsl(${hue}, ${style.saturation}%, ${Math.max(style.lightness - 20, 15)}%)`;
        ctx.globalAlpha = style.lineAlpha;
        ctx.lineWidth = style.lineWidth;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        shapePoints.forEach((p, j) => {
            if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ctx.restore();
    }
}

function drawFlow(ctx, shapePoints, hue, style, random) {
    const strands = 4 + Math.floor(random() * 5);
    for (let s = 0; s < strands; s++) {
        const offsetX = (random() - 0.5) * 24;
        const offsetY = (random() - 0.5) * 24;
        const lightness = Math.max(style.lightness - 15 + random() * 20, 15);
        ctx.strokeStyle = `hsl(${hue}, ${style.saturation}%, ${lightness}%)`;
        ctx.globalAlpha = style.lineAlpha * (0.4 + random() * 0.5);
        ctx.lineWidth = style.lineWidth * (0.8 + random() * 1.6);
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        shapePoints.forEach((p, j) => {
            const x = p.x + offsetX;
            const y = p.y + offsetY;
            if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
    }
}

function drawParticles(ctx, shapePoints, hue, style, random) {
    const step = Math.max(1, Math.floor(shapePoints.length / 220));
    for (let i = 0; i < shapePoints.length; i += step) {
        const p = shapePoints[i];
        const jitterX = (random() - 0.5) * 18;
        const jitterY = (random() - 0.5) * 18;
        const radius = 1 + random() * 3;
        const lightness = Math.max(style.lightness - 10 + random() * 30, 15);
        ctx.fillStyle = `hsla(${hue}, ${style.saturation}%, ${lightness}%, ${style.lineAlpha * (0.4 + random() * 0.6)})`;
        ctx.beginPath();
        ctx.arc(p.x + jitterX, p.y + jitterY, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawRoute(canvas, points, seed, weather) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = cssVar('--surface');
    ctx.fillRect(0, 0, SIZE, SIZE);

    if (!points || points.length === 0) return;

    const lats = points.map(p => p.lat);
    const lngs = points.map(p => p.lng);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);

    const latSpan = Math.max(maxLat - minLat, 1e-9);
    const lngSpan = Math.max((maxLng - minLng) * Math.cos((minLat + maxLat) / 2 * Math.PI / 180), 1e-9);

    const scale = Math.min((SIZE - PADDING * 2) / lngSpan, (SIZE - PADDING * 2) / latSpan) * 0.68;
    const cosLat = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);

    const centerLng = (minLng + maxLng) / 2;
    const centerLat = (minLat + maxLat) / 2;
    const shapePoints = points.map(p => ({
        x: (p.lng - centerLng) * cosLat * scale,
        y: -(p.lat - centerLat) * scale
    }));

    const random = seededRandom(seed || 1);

    const hasWeather = weather && weather.weatherCode !== -1 && !Number.isNaN(weather.temperatureCelsius);
    const hue = hasWeather ? temperatureToHue(weather.temperatureCelsius) : Math.floor(random() * 360);
    const style = (hasWeather && weatherStyle(weather.weatherCode)) || {
        blobCount: [5, 8], blobAlpha: 0.35, saturation: 75, lightness: 32, lineAlpha: 0.55, lineWidth: 1.6, layers: [3, 8]
    };

    drawWatercolorBackground(ctx, SIZE, random, hue, style);

    const [minLayers, maxLayers] = style.layers;
    const layers = minLayers + Math.floor(random() * (maxLayers - minLayers + 1));

        ctx.save();
    ctx.translate(SIZE / 2, SIZE / 2);

    const mode = style.mode || ['kaleidoscope', 'flow', 'particles'][Math.floor(random() * 3)];
    if (mode === 'kaleidoscope') {
        drawKaleidoscope(ctx, shapePoints, hue, style, random);
    } else if (mode === 'flow') {
        drawFlow(ctx, shapePoints, hue, style, random);
    } else {
        drawParticles(ctx, shapePoints, hue, style, random);
    }

    ctx.restore();
}

   function redrawAll() {
    document.querySelectorAll('#gallery canvas').forEach(canvas => {
        if (canvas._points) drawRoute(canvas, canvas._points, canvas._id, canvas._weather);
    });
    }

    const TYPE_NAMES = {
        Run: 'Løping', TrailRun: 'Terrengløp', Ride: 'Sykling',
        VirtualRide: 'Innesykling', MountainBikeRide: 'Terrengsykling',
        Walk: 'Gange', Hike: 'Fottur', Swim: 'Svømming',
        NordicSki: 'Langrenn', AlpineSki: 'Alpint', Rowing: 'Roing'
    };

    const nf = new Intl.NumberFormat('nb-NO', { maximumFractionDigits: 1 });

    function formatDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (isNaN(d)) return '';
        return d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const gallery = document.getElementById('gallery');
    const stats = document.getElementById('stats');
    const galleryIndex = document.getElementById('galleryIndex');

    const pad = n => String(n).padStart(2, '0');

    function showSkeletons(n = 6) {
        stats.hidden = true;
        galleryIndex.textContent = '';
        gallery.innerHTML = '';
        for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.className = 'skeleton';
            gallery.appendChild(el);
        }
    }

    function showNote(title, body) {
        stats.hidden = true;
        galleryIndex.textContent = '';
        gallery.innerHTML = '';
        gallery.style.gridTemplateColumns = '1fr';
        const note = document.createElement('div');
        note.className = 'note';
        const strong = document.createElement('strong');
        strong.textContent = title;
        note.appendChild(strong);
        note.appendChild(document.createTextNode(body));
        gallery.appendChild(note);
    }

    function renderStats(activities) {
        const km = activities.reduce((sum, a) => sum + (a.distanceMeters || 0), 0) / 1000;
        const elev = activities.reduce((sum, a) => sum + (a.elevationGainMeters || 0), 0);
        document.getElementById('statCount').textContent = activities.length;
        document.getElementById('statDistance').textContent = nf.format(km) + ' km';
        document.getElementById('statElevation').textContent = Math.round(elev) + ' m';
        stats.hidden = false;
        galleryIndex.textContent = activities.length
            ? pad(1) + ' — ' + pad(activities.length)
            : '';
    }

    function renderCard(activity, index) {
        const card = document.createElement('article');
        card.className = 'card';

        const canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Rutetegning: ' + (activity.name || 'aktivitet'));
        canvas._points = activity.points;
        canvas._id = activity.id;
        canvas._weather = activity.weatherInfo;
        card.appendChild(canvas);

        const body = document.createElement('div');
        body.className = 'card-body';

        const figures = document.createElement('div');
        figures.className = 'card-figures';
        const num = document.createElement('span');
        num.textContent = pad(index + 1);
        const measures = document.createElement('span');
        measures.textContent = nf.format((activity.distanceMeters || 0) / 1000) + ' km · '
            + Math.round(activity.elevationGainMeters || 0) + ' m ↑';
        figures.append(num, measures);
        body.appendChild(figures);

        const title = document.createElement('h3');
        title.className = 'card-title';
        title.textContent = activity.name || 'Uten navn';
        body.appendChild(title);

        const meta = document.createElement('p');
        meta.className = 'card-meta';
        meta.textContent = [TYPE_NAMES[activity.type] || activity.type, formatDate(activity.date)]
            .filter(Boolean).join(' · ');
        body.appendChild(meta);

        card.appendChild(body);
        gallery.appendChild(card);

        drawRoute(canvas, activity.points, activity.id, activity.weatherInfo);
    }

    function loadActivities() {
        showSkeletons();
        fetch('/api/activities')
            .then(response => {
                if (!response.ok) throw new Error('status ' + response.status);
                return response.json();
            })
            .then(activities => {
                gallery.style.gridTemplateColumns = '';
                if (!activities.length) {
                    showNote('Ingen ruter ennå',
                        'Vi fant ingen aktiviteter med kart. Legg ut en tur på Strava, så dukker den opp her.');
                    return;
                }
                gallery.innerHTML = '';
                renderStats(activities);
                activities.forEach(renderCard);
            })
            .catch(() => {
                showNote('Ikke koblet til Strava',
                    'Logg inn med Strava øverst for å hente aktivitetene dine.');
            });


}



    function checkConnectionStatus() {
        fetch('/api/status')
            .then(response => response.json())
            .then(status => {
                if (status.connected) {
                    document.getElementById('loginBtn').hidden = true;
                }
        });
        }
    document.getElementById('refreshBtn').addEventListener('click', loadActivities);
    loadActivities();
    checkConnectionStatus();
</script>
</body>
</html>
