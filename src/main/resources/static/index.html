<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruter → Kunst</title>

    <style>
        :root {
            --bg:          #f4efe4;
            --bg-soft:     #ebe4d5;
            --surface:     #faf7f0;
            --ink:         #16150f;
            --ink-muted:   #6a6558;
            --ink-faint:   #97907f;
            --line:        rgba(22, 21, 15, 0.14);
            --line-strong: rgba(22, 21, 15, 0.28);
            --route:       #16150f;
            --route-start: #16150f;
            --btn-bg:      #16150f;
            --btn-ink:     #faf7f0;
            --shadow:      0 1px 2px rgba(22, 21, 15, 0.06),
                           0 8px 24px rgba(22, 21, 15, 0.06);
        }

        :root:not([data-theme="light"]) {
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:          #100f0c;
                --bg-soft:     #191712;
                --surface:     #1b1915;
                --ink:         #f0eade;
                --ink-muted:   #a09986;
                --ink-faint:   #6f6a5c;
                --line:        rgba(240, 234, 222, 0.14);
                --line-strong: rgba(240, 234, 222, 0.30);
                --route:       #f0eade;
                --route-start: #f0eade;
                --btn-bg:      #f0eade;
                --btn-ink:     #100f0c;
                --shadow:      0 1px 2px rgba(0, 0, 0, 0.4),
                               0 8px 24px rgba(0, 0, 0, 0.35);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg:          #100f0c;
            --bg-soft:     #191712;
            --surface:     #1b1915;
            --ink:         #f0eade;
            --ink-muted:   #a09986;
            --ink-faint:   #6f6a5c;
            --line:        rgba(240, 234, 222, 0.14);
            --line-strong: rgba(240, 234, 222, 0.30);
            --route:       #f0eade;
            --route-start: #f0eade;
            --btn-bg:      #f0eade;
            --btn-ink:     #100f0c;
            --shadow:      0 1px 2px rgba(0, 0, 0, 0.4),
                           0 8px 24px rgba(0, 0, 0, 0.35);
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        [hidden] {
    display: none !important;
}

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 24px 96px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 0;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        .mark svg { display: block; }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .theme-toggle:hover { border-color: var(--line-strong); background: var(--bg-soft); }
        .theme-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
        .theme-toggle svg { display: block; }
        .icon-moon { display: none; }
        :root[data-theme="dark"] .icon-sun { display: none; }
        :root[data-theme="dark"] .icon-moon { display: block; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .icon-sun  { display: none; }
            :root:not([data-theme="light"]) .icon-moon { display: block; }
        }

        .hero {
            padding: 56px 0 40px;
            border-bottom: 1px solid var(--line);
        }

        .hero h1 {
            margin: 0;
            font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
            font-weight: 400;
            font-size: clamp(2.6rem, 7vw, 4.6rem);
            line-height: 1.02;
            letter-spacing: -0.02em;
        }

        .hero h1 em {
            font-style: italic;
            color: var(--ink-muted);
        }

        .hero p {
            margin: 20px 0 0;
            max-width: 46ch;
            font-size: 1.05rem;
            color: var(--ink-muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: var(--btn-bg);
            color: var(--btn-ink);
            font: inherit;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

        .btn-ghost {
            background: transparent;
            color: var(--ink);
            border-color: var(--line-strong);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            padding: 28px 0;
            border-bottom: 1px solid var(--line);
        }

        .stats[hidden] { display: none; }

        .stat-label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .stat-value {
            font-family: ui-serif, Georgia, "Times New Roman", serif;
            font-size: 1.9rem;
            line-height: 1.2;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 40px 0 20px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--ink-muted);
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--line-strong);
        }

        .card canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background: var(--surface);
        }

        .card-body {
            padding: 16px 18px 18px;
            border-top: 1px solid var(--line);
        }

        .card-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .card-meta {
            margin: 6px 0 0;
            font-size: 0.82rem;
            color: var(--ink-faint);
        }

        .card-figures {
            display: flex;
            gap: 18px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            font-size: 0.85rem;
            color: var(--ink-muted);
            font-variant-numeric: tabular-nums;
        }

        .note {
            padding: 56px 24px;
            text-align: center;
            border: 1px dashed var(--line-strong);
            border-radius: 14px;
            color: var(--ink-muted);
        }

        .note strong {
            display: block;
            margin-bottom: 6px;
            color: var(--ink);
            font-weight: 500;
        }

        .skeleton {
            background: var(--bg-soft);
            border: 1px solid var(--line);
            border-radius: 14px;
            aspect-ratio: 1 / 1.28;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.55; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        footer {
            margin-top: 64px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            font-size: 0.8rem;
            color: var(--ink-faint);
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <div class="mark">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2 13c2.5 0 3-9 6-9s3.5 9 6 9" stroke="currentColor" stroke-width="1.4"
                      stroke-linecap="round"/>
            </svg>
            Ruter → Kunst
        </div>

        <button class="theme-toggle" id="themeToggle" type="button"
                aria-label="Bytt mellom lyst og mørkt tema">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
        </button>
    </div>

    <header class="hero">
        <h1>Rutene dine,<br><em>som kunst.</em></h1>
        <p>Hver tur du har løpt eller syklet blir tegnet opp som en egen strek. Koble til
            Strava for å se samlingen din.</p>
        <div class="actions">
            <a class="btn" href="/login" id="loginBtn">Logg inn med Strava</a>
            <button class="btn btn-ghost" id="refreshBtn" type="button">Oppdater</button>
        </div>
    </header>

    <section class="stats" id="stats" hidden>
        <div>
            <div class="stat-label">Aktiviteter</div>
            <div class="stat-value" id="statCount">–</div>
        </div>
        <div>
            <div class="stat-label">Distanse</div>
            <div class="stat-value" id="statDistance">–</div>
        </div>
        <div>
            <div class="stat-label">Høydemeter</div>
            <div class="stat-value" id="statElevation">–</div>
        </div>
    </section>

    <div class="section-head">
        <h2>Galleri</h2>
    </div>

    <div id="gallery"></div>

    <footer>Tegnet lokalt i nettleseren fra Strava-rutene dine.</footer>
</div>

<script>
    const root = document.documentElement;
    const stored = localStorage.getItem('theme');
    if (stored === 'light' || stored === 'dark') {
        root.setAttribute('data-theme', stored);
    }

    function currentTheme() {
        return root.getAttribute('data-theme')
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        const next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        redrawAll();
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!root.hasAttribute('data-theme')) redrawAll();
    });

    const SIZE = 400;
    const PADDING = 36;

    function cssVar(name) {
        return getComputedStyle(root).getPropertyValue(name).trim();
    }

    function seededRandom(seed) {
        let value = seed;
        return function () {
            value = (value * 9301 + 49297) % 233280;
            return value / 233280;
        };
    }


    function drawWatercolorBackground(ctx, size, random, hue) {
    const blobCount = 5 + Math.floor(random() * 4);

    for (let i = 0; i < blobCount; i++) {
        const blobHue = (hue + (random() - 0.5) * 140 + 360) % 360;
        const x = random() * size;
        const y = random() * size;
        const radius = size * (0.35 + random() * 0.45);

        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, `hsla(${blobHue}, 70%, 60%, 0.35)`);
        gradient.addColorStop(1, `hsla(${blobHue}, 70%, 60%, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

    function drawRoute(canvas, points, seed) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = SIZE * dpr;
        canvas.height = SIZE * dpr;

        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        ctx.fillStyle = cssVar('--surface');
        ctx.fillRect(0, 0, SIZE, SIZE);

        if (!points || points.length === 0) return;

        const lats = points.map(p => p.lat);
        const lngs = points.map(p => p.lng);
        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);

        const latSpan = Math.max(maxLat - minLat, 1e-9);
        const lngSpan = Math.max((maxLng - minLng) * Math.cos((minLat + maxLat) / 2 * Math.PI / 180), 1e-9);

        const scale = Math.min((SIZE - PADDING * 2) / lngSpan, (SIZE - PADDING * 2) / latSpan) * 0.68;
        const cosLat = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);

        const centerLng = (minLng + maxLng) / 2;
        const centerLat = (minLat + maxLat) / 2;
        const shapePoints = points.map(p => ({
            x: (p.lng - centerLng) * cosLat * scale,
            y: -(p.lat - centerLat) * scale
        }));

        const random = seededRandom(seed || 1);
        const hue = Math.floor(random() * 360);

        drawWatercolorBackground(ctx, SIZE, random, hue);

        const layers = 3 + Math.floor(random() * 6);

        ctx.save();
        ctx.translate(SIZE / 2, SIZE / 2);

        for (let i = 0; i < layers; i++) {
            ctx.save();
            ctx.rotate((Math.PI * 2 * i) / layers);

            ctx.strokeStyle = `hsl(${hue}, 75%, 32%)`;
            ctx.globalAlpha = 0.55;
            ctx.lineWidth = 1.6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            ctx.beginPath();
            shapePoints.forEach((p, j) => {
                if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            ctx.restore();
        }

        ctx.restore();
    }

    function redrawAll() {
        document.querySelectorAll('#gallery canvas').forEach(canvas => {
            if (canvas._points) drawRoute(canvas, canvas._points, canvas._id);
        });
    }

    const TYPE_NAMES = {
        Run: 'Løping', TrailRun: 'Terrengløp', Ride: 'Sykling',
        VirtualRide: 'Innesykling', MountainBikeRide: 'Terrengsykling',
        Walk: 'Gange', Hike: 'Fottur', Swim: 'Svømming',
        NordicSki: 'Langrenn', AlpineSki: 'Alpint', Rowing: 'Roing'
    };

    const nf = new Intl.NumberFormat('nb-NO', { maximumFractionDigits: 1 });

    function formatDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (isNaN(d)) return '';
        return d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const gallery = document.getElementById('gallery');
    const stats = document.getElementById('stats');

    function showSkeletons(n = 6) {
        stats.hidden = true;
        gallery.innerHTML = '';
        for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.className = 'skeleton';
            gallery.appendChild(el);
        }
    }

    function showNote(title, body) {
        stats.hidden = true;
        gallery.innerHTML = '';
        gallery.style.gridTemplateColumns = '1fr';
        const note = document.createElement('div');
        note.className = 'note';
        const strong = document.createElement('strong');
        strong.textContent = title;
        note.appendChild(strong);
        note.appendChild(document.createTextNode(body));
        gallery.appendChild(note);
    }

    function renderStats(activities) {
        const km = activities.reduce((sum, a) => sum + (a.distanceMeters || 0), 0) / 1000;
        const elev = activities.reduce((sum, a) => sum + (a.elevationGainMeters || 0), 0);
        document.getElementById('statCount').textContent = activities.length;
        document.getElementById('statDistance').textContent = nf.format(km) + ' km';
        document.getElementById('statElevation').textContent = Math.round(elev) + ' m';
        stats.hidden = false;
    }

    function renderCard(activity) {
        const card = document.createElement('article');
        card.className = 'card';

        const canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Rutetegning: ' + (activity.name || 'aktivitet'));
        canvas._points = activity.points;
        canvas._id = activity.id;
        card.appendChild(canvas);

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('h3');
        title.className = 'card-title';
        title.textContent = activity.name || 'Uten navn';
        body.appendChild(title);

        const meta = document.createElement('p');
        meta.className = 'card-meta';
        meta.textContent = [TYPE_NAMES[activity.type] || activity.type, formatDate(activity.date)]
            .filter(Boolean).join(' · ');
        body.appendChild(meta);

        const figures = document.createElement('div');
        figures.className = 'card-figures';
        const dist = document.createElement('span');
        dist.textContent = nf.format((activity.distanceMeters || 0) / 1000) + ' km';
        const elev = document.createElement('span');
        elev.textContent = Math.round(activity.elevationGainMeters || 0) + ' m ↑';
        figures.append(dist, elev);
        body.appendChild(figures);

        card.appendChild(body);
        gallery.appendChild(card);

        drawRoute(canvas, activity.points, activity.id);
    }

    function loadActivities() {
        showSkeletons();
        fetch('/api/activities')
            .then(response => {
                if (!response.ok) throw new Error('status ' + response.status);
                return response.json();
            })
            .then(activities => {
                gallery.style.gridTemplateColumns = '';
                if (!activities.length) {
                    showNote('Ingen ruter ennå',
                        'Vi fant ingen aktiviteter med kart. Legg ut en tur på Strava, så dukker den opp her.');
                    return;
                }
                gallery.innerHTML = '';
                renderStats(activities);
                activities.forEach(renderCard);
            })
            .catch(() => {
                showNote('Ikke koblet til Strava',
                    'Logg inn med Strava øverst for å hente aktivitetene dine.');
            });


}



    function checkConnectionStatus() {
        fetch('/api/status')
            .then(response => response.json())
            .then(status => {
                if (status.connected) {
                    document.getElementById('loginBtn').hidden = true;
                }
        });
        }
    document.getElementById('refreshBtn').addEventListener('click', loadActivities);
    loadActivities();
    checkConnectionStatus();
</script>
</body>
</html>
